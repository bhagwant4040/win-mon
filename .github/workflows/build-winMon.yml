name: Build winMon.exe

# Builds the Windows agent into a single winMon.exe in the cloud (GitHub's
# Windows runners) and uploads it as a downloadable artifact — so you can get
# the .exe without owning/using a Windows PC.

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    paths: ['agent/**']

permissions:
  contents: write            # needed to publish the release for auto-update

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # A .exe with no publisher/version metadata (right-click → Properties →
      # Details is blank) is one of the signals Defender's heuristics weigh
      # when scoring an unsigned binary as suspicious — this stamps the
      # CURRENT APP_VERSION into version_info.txt's placeholders so it's
      # never stale, then PyInstaller embeds it as a real Windows version
      # resource below (--version-file).
      - name: Stamp version info
        shell: bash
        working-directory: agent
        run: |
          VER=$(grep -oE "APP_VERSION = '[^']+'" agent.py | head -1 | cut -d"'" -f2)
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          echo "stamping version $MAJOR.$MINOR.0.0"
          sed -i "s/2, 14, 0, 0/${MAJOR}, ${MINOR}, 0, 0/g; s/2\.14\.0\.0/${MAJOR}.${MINOR}.0.0/g" version_info.txt

      - name: Build winMon.exe
        working-directory: agent
        run: >
          pyinstaller --noconsole --onefile --name winMon --noupx
          --version-file version_info.txt
          --hidden-import win32gui --hidden-import win32process --hidden-import win32api
          --hidden-import win32file --hidden-import win32print --hidden-import winreg
          --hidden-import psutil --hidden-import uiautomation
          --collect-all PIL
          --hidden-import PIL.ImageGrab --hidden-import PIL.JpegImagePlugin
          --hidden-import pynput.keyboard --hidden-import pynput.mouse
          --collect-all sounddevice --collect-all numpy
          --hidden-import websocket --hidden-import numpy
          --collect-all cv2 --hidden-import cv2
          agent.py

      - name: Upload winMon.exe (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: winMon-exe
          path: agent/dist/winMon.exe
          if-no-files-found: error

      # Publish a GitHub Release tagged with the agent's APP_VERSION and attach
      # winMon.exe. Installed agents check the "latest" release and self-update.
      - name: Publish release for auto-update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oE "APP_VERSION = '[^']+'" agent/agent.py | head -1 | cut -d"'" -f2)
          echo "version=$VER"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" agent/dist/winMon.exe --clobber
          else
            gh release create "v$VER" agent/dist/winMon.exe \
              --title "winMon v$VER" --notes "Automated build — agents auto-update to this version."
          fi
